name: Build AstralCheat

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot perl dpkg curl xz-utils

      - name: Setup Theos
        run: |
          # Theos
          git clone --depth=1 https://github.com/theos/theos $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          # SDK
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks $HOME/theos/sdks
          
          # Toolchain
          mkdir -p $HOME/theos/toolchain
          cd /tmp
          curl -L -o toolchain.tar.lzma https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          tar --lzma -xf toolchain.tar.lzma -C $HOME/theos/toolchain
          
          # Make dm.pl executable and available
          chmod +x $HOME/theos/bin/*
          ln -sf $HOME/theos/bin/dm.pl /usr/local/bin/dm.pl
          
          # Verify
          which dm.pl
          dm.pl -h || true
          ls $HOME/theos/sdks
          ls $HOME/theos/toolchain

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1
          ls -la packages/

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: AstralCheat
          path: packages/*.deb
